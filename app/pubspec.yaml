name: oevira
description: 寰意 / OEVIRA Web and Windows workspace client.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: false
  fonts:
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/NotoSansSC.ttf
    - family: NotoSansKR
      fonts:
        - asset: assets/fonts/NotoSansKR.ttf
    - family: NotoColorEmoji
      fonts:
        - asset: assets/fonts/NotoColorEmoji.ttf

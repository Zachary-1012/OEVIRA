name: OEVIRA Product Development Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    name: Repository contracts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: server
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned product dependencies
        run: python -m pip install -r server/requirements.txt -c server/constraints.txt
      - name: Check repository and source contracts
        run: python scripts/verify_repository.py
      - name: Verify repository admission regressions
        run: python -m unittest discover -s tests -v
      - name: Verify product persistence, authorization and processing
        run: python -m unittest discover -s server/tests -v
      - name: Obtain the verified Flutter SDK
        uses: actions/checkout@v5
        with:
          repository: flutter/flutter
          ref: 6a19cca56475dbfba1478ee68d7bd0c2ef891da1
          path: .runtime/flutter
          persist-credentials: false
      - name: Add Flutter to path
        shell: pwsh
        run: Add-Content -LiteralPath $env:GITHUB_PATH -Value "$env:GITHUB_WORKSPACE/.runtime/flutter/bin"
      - name: Resolve locked client dependencies
        working-directory: app
        run: flutter pub get --enforce-lockfile
      - name: Analyze client
        working-directory: app
        run: flutter analyze
      - name: Verify client behavior
        working-directory: app
        run: flutter test
      - name: Build actual Web client
        working-directory: app
        run: flutter build web --release --no-web-resources-cdn

  windows:
    name: Cross-platform repository checks
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: server
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned product dependencies
        run: python -m pip install -r server/requirements.txt -c server/constraints.txt
      - name: Check native paths and repository contracts
        run: python scripts/verify_repository.py
      - name: Verify repository admission regressions
        run: python -m unittest discover -s tests -v
      - name: Verify product persistence, authorization and processing
        run: python -m unittest discover -s server/tests -v
      - name: Obtain the verified Flutter SDK
        uses: actions/checkout@v5
        with:
          repository: flutter/flutter
          ref: 6a19cca56475dbfba1478ee68d7bd0c2ef891da1
          path: .runtime/flutter
          persist-credentials: false
      - name: Add Flutter to path
        shell: pwsh
        run: Add-Content -LiteralPath $env:GITHUB_PATH -Value "$env:GITHUB_WORKSPACE/.runtime/flutter/bin"
      - name: Resolve locked client dependencies
        working-directory: app
        run: flutter pub get --enforce-lockfile
      - name: Analyze client
        working-directory: app
        run: flutter analyze
      - name: Verify client behavior
        working-directory: app
        run: flutter test
      - name: Build actual Windows application
        working-directory: app
        run: flutter build windows --release
